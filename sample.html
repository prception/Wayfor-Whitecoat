<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

h1 {
  padding: 20px;
}

/* 🔥 GRID CONTAINER */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 10px;
  padding: 20px;

  /* FIX GAP ISSUE */
  grid-auto-flow: dense;
}

/* ITEM STYLE */
.item {
  overflow: hidden;
  border-radius: 12px;
}

/* IMAGE */
.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

/* HOVER EFFECT */
.item:hover img {
  transform: scale(1.1);
}

/* GRID SIZES */
.tall {
  grid-row: span 2;
}

.wide {
  grid-column: span 2;
}

.big {
  grid-column: span 2;
  grid-row: span 2;
}

/* MOBILE FIX */
@media (max-width: 600px) {
  .wide, .big {
    grid-column: span 1;
  }
}
</style>

</head>
<body>

<h1>My Grid Gallery</h1>

<div class="gallery">

  <div class="item tall">
    <img src="https://picsum.photos/400/600?random=1">
  </div>

  <div class="item">
    <img src="https://picsum.photos/400/400?random=2">
  </div>

  <div class="item wide">
    <img src="https://picsum.photos/800/400?random=3">
  </div>

  <div class="item">
    <img src="https://picsum.photos/400/400?random=4">
  </div>

  <div class="item big">
    <img src="https://picsum.photos/800/800?random=5">
  </div>
  

  <div class="item">
    <img src="https://picsum.photos/400/400?random=6">
  </div>

  <div class="item tall">
    <img src="https://picsum.photos/400/600?random=7">
  </div>

  <div class="item">
    <img src="https://picsum.photos/400/400?random=8">
  </div>

</div>

</body>
</html>
